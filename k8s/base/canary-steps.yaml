# Estrategia canary común (JSON patch aplicado a todos los Rollouts):
#
#   20% -> pausa 60s -> análisis -> 50% -> pausa 60s -> análisis -> 100%
#
# Si un análisis falla, Argo aborta y deja el 100% del tráfico en la versión
# estable de forma automática (rollback sin intervención humana).
# Los argumentos salen de las etiquetas/anotaciones del propio Rollout, así el
# mismo AnalysisTemplate sirve para los 4 servicios y los 3 ambientes.
- op: add
  path: /spec/strategy/canary/steps
  value:
    - setWeight: 20
    - pause: { duration: 60s }
    - analysis: &analysis
        templates:
          - templateName: canary-analysis
        args:
          - name: service
            valueFrom: { fieldRef: { fieldPath: "metadata.labels['app.kubernetes.io/name']" } }
          - name: version
            valueFrom: { fieldRef: { fieldPath: "metadata.labels['app.kubernetes.io/version']" } }
          - name: env
            valueFrom: { fieldRef: { fieldPath: "metadata.labels['aegisvolt/env']" } }
          - name: namespace
            valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          - name: probe-method
            valueFrom: { fieldRef: { fieldPath: "metadata.annotations['aegisvolt/probe-method']" } }
          - name: probe-path
            valueFrom: { fieldRef: { fieldPath: "metadata.annotations['aegisvolt/probe-path']" } }
          - name: probe-body
            valueFrom: { fieldRef: { fieldPath: "metadata.annotations['aegisvolt/probe-body']" } }
    - setWeight: 50
    - pause: { duration: 60s }
    - analysis: *analysis
