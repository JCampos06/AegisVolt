# -----------------------------------------------------------------------------
# Base común de AegisVolt (la misma para dev, test y prod).
#   - 4 Rollouts de Argo (canary 20 -> 50 -> 100 con análisis automático)
#   - Service estable + Service canary por servicio
#   - Ingress NGINX para el gateway (el canary del gateway reparte tráfico por peso)
#   - AnalysisTemplate "canary-analysis" (success-rate + 5xx en CloudWatch)
#
# Los overlays (k8s/overlays/<env>) ponen el namespace, APP_ENV, réplicas y host.
# La etiqueta de imagen (<git-sha>) la fija scripts/k8s-deploy.sh, nunca "latest".
# -----------------------------------------------------------------------------
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: aegisvolt

configurations:
  - kustomizeconfig/rollout.yaml

resources:
  - analysis-template.yaml
  - station-reservation-service.yaml
  - billing-wallet-service.yaml
  - energy-dispatch-service.yaml
  - graphql-gateway.yaml

# Configuración común a los 4 servicios. Sin sufijo hash: el nombre es estable y
# un cambio de ConfigMap no dispara un canary (el canary lo dispara la imagen).
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: aegisvolt-config
    literals:
      - APP_ENV=dev
      # Floci conectado a la red "kind" (scripts/kind-up.sh). En AWS real se quita
      # y el SDK usa los endpoints regionales a través de los VPC Endpoints.
      - AWS_ENDPOINT_URL=http://aegisvolt-floci:4566
      - AWS_REGION=us-east-1
      - CLOUDWATCH_LOGS_ENABLED=true
      - LOG_LEVEL=info

# Mismos pasos de canary para todos los Rollouts (un solo lugar que mantener).
patches:
  - path: canary-steps.yaml
    target:
      kind: Rollout
