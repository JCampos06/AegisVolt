# GraphQL Gateway (BFF + orquestador de la SAGA, puerto 4000).
#
# Canary con NGINX: Argo crea un Ingress "-canary" con la anotación
# nginx.ingress.kubernetes.io/canary-weight = 20 / 50 y lo borra al terminar.
# El tráfico externo (frontend, curl) se reparte por peso, no por réplicas.
#
# 1 réplica por ambiente: las Subscriptions usan un PubSub en memoria
# (ADR-0005). Durante un canary convive temporalmente 1 pod estable + 1 canary.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: graphql-gateway
  labels:
    app.kubernetes.io/name: graphql-gateway
    app.kubernetes.io/version: unset # lo reemplaza scripts/k8s-deploy.sh con el git-sha
    aegisvolt/tier: edge
  annotations:
    aegisvolt/probe-method: POST
    aegisvolt/probe-path: /graphql
    aegisvolt/probe-body: '{"query":"{ environment stations { id } }"}'
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: graphql-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graphql-gateway
        app.kubernetes.io/part-of: aegisvolt
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: app
          image: aegisvolt/graphql-gateway
          env:
            # Índice 0: scripts/k8s-deploy.sh lo reemplaza con el git-sha desplegado.
            - { name: APP_VERSION, value: unset }
            - { name: PORT, value: "4000" }
            # Servicios internos del mismo namespace (Service estable, puerto 80).
            - { name: RESERVATION_URL, value: http://station-reservation-service }
            - { name: BILLING_URL, value: http://billing-wallet-service }
            - { name: DISPATCH_URL, value: http://energy-dispatch-service }
            # Solo se exige para setFeatureFlag en prod. Lo crea scripts/k8s-deploy.sh
            # (nunca se versiona); si no existe, el gateway arranca igual.
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef: { name: gateway-admin, key: token, optional: true }
          envFrom:
            - configMapRef: { name: aegisvolt-config }
          ports:
            - { name: http, containerPort: 4000 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 1000m, memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
  strategy:
    canary:
      stableService: graphql-gateway
      canaryService: graphql-gateway-canary
      trafficRouting:
        nginx:
          stableIngress: graphql-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: graphql-gateway
spec:
  selector:
    app.kubernetes.io/name: graphql-gateway
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: graphql-gateway-canary
spec:
  selector:
    app.kubernetes.io/name: graphql-gateway
  ports:
    - { name: http, port: 80, targetPort: http }
---
# Entrada HTTP del gateway: /graphql (HTTP y WebSocket). "/" lo atiende el Ingress
# "frontend". El host lo fija cada overlay (<env>.aegisvolt.localhost).
# kind publica el puerto 80 del nodo en localhost:8080 (k8s/kind-config.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: graphql-gateway
  annotations:
    # WebSocket de las Subscriptions (graphql-ws): conexiones largas.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: dev.aegisvolt.localhost
      http:
        paths:
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: graphql-gateway
                port: { name: http }
