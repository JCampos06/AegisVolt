# nginx para contenedor sin root y con sistema de archivos de solo lectura:
# todo lo que nginx escribe (pid, temporales, config generada) va a /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  log_format json escape=json '{"time":"$time_iso8601","service":"frontend","status":$status,'
    '"method":"$request_method","path":"$uri","bytes":$body_bytes_sent,"ms":$request_time}';
  access_log /dev/stdout json;

  sendfile on;
  server_tokens off;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # WebSocket de las subscriptions (graphql-ws)
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Generado al arrancar desde /etc/nginx/templates/default.conf.template
  include /tmp/default.conf;
}
